    // Class Hierarchy Index Finder
    const getMinClassIndex = (student) => {
      if (!student.classes || student.classes.length === 0) return 999;
      const indices = student.classes.map(c => {
        const idx = DANCE_CLASSES.indexOf(c);
        return idx === -1 ? 998 : idx;
      });
      return Math.min(...indices);
    };

    // Sort Students Function
    const sortStudentsByClassHierarchy = (studentsList) => {
      return [...studentsList].sort((a, b) => {
        const idxA = getMinClassIndex(a);
        const idxB = getMinClassIndex(b);
        if (idxA !== idxB) return idxA - idxB;
        const nameA = `${a.lastName || ''} ${a.firstName || ''}`;
        const nameB = `${b.lastName || ''} ${b.firstName || ''}`;
        return nameA.localeCompare(nameB, 'el');
      });
    };

    function App() {

          return s ? JSON.parse(s) : SAMPLE_STUDENTS;

      });

      const [classrooms, setClassrooms] = useState(() => {
        try {
          const s = localStorage.getItem('hod_v13_rooms');
          return s ? JSON.parse(s) : SAMPLE_ROOMS;

      });

      // --- UI NAVIGATION STATES ---
      const [activeTab, setActiveTab] = useState('home');
      const [toastMsg, setToastMsg] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [classFilter, setClassFilter] = useState('ALL');

      // --- MODALS & FORMS ---
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [editingStudentId, setEditingStudentId] = useState(null);
      const initialStudentForm = {
        firstName: '', lastName: '', dob: '', amka: '',
        parentsNames: '', parentsMobiles: '', landline: '', afm: '', doy: '',
        email: '', address: '', notes: '', classes: [], receiptDetails: ''
      };

      // Kartella Modal
      const [kartellaStudent, setKartellaStudent] = useState(null);

      // Email Center State
      const [emailTargetClass, setEmailTargetClass] = useState('ALL');
      const [emailSubject, setEmailSubject] = useState('');
      const [emailBody, setEmailBody] = useState('');

      // Print Center Filter
      const [printClassFilter, setPrintClassFilter] = useState('ALL');

      // Classroom Modal
      const [isRoomModalOpen, setIsRoomModalOpen] = useState(false);
      const [newRoomName, setNewRoomName] = useState('');
      const [editingRoomIndex, setEditingRoomIndex] = useState(null);
      const [editRoomNameVal, setEditRoomNameVal] = useState('');

      // Schedule Slot Modal
      const [isSlotModalOpen, setIsSlotModalOpen] = useState(false);
      const [editingSlotId, setEditingSlotId] = useState(null);
      const initialSlotForm = {
        day: 'Δευτέρα', startTime: '16:00', endTime: '17:00',
        danceClass: 'BABIES', classroom: classrooms[0] || 'Αίθουσα Prima', teacher: 'Susan Jane Garrard'
      };
      const [slotForm, setSlotForm] = useState(initialSlotForm);
      const [scheduleRoomFilter, setScheduleRoomFilter] = useState('ALL');

      // User Modal
      const [isUserModalOpen, setIsUserModalOpen] = useState(false);

      const [deleteModal, setDeleteModal] = useState({ open: false, title: '', message: '', onConfirm: null });

      // --- FIREBASE REALTIME SYNC EFFECT ---
      useEffect(() => {
        if (!db) {
          setCloudStatus('local');
          return;
        }

        // 1. Sync Students Collection
        const unsubStudents = db.collection('students').onSnapshot(
          snapshot => {
            const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (loaded.length > 0) {
              setStudents(loaded);
              try { localStorage.setItem('hod_v13_students', JSON.stringify(loaded)); } catch(e){}
            }
            setCloudStatus('synced');
            setCloudErrMsg('');
          },
          err => {
            console.warn("Students Firestore Error:", err);
            setCloudStatus('error');
            setCloudErrMsg(err.message || 'Error connecting to Firestore');
          }
        );

        // 2. Sync Classrooms Collection
        const unsubRooms = db.collection('classrooms').onSnapshot(
          snapshot => {
            const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (loaded.length > 0) {
              const names = loaded.map(r => r.name || r.id);
              setClassrooms(names);
              try { localStorage.setItem('hod_v13_rooms', JSON.stringify(names)); } catch(e){}
            }
          },
          err => console.warn("Rooms Firestore Error:", err)
        );

        // 3. Sync Schedule Collection
        const unsubSchedule = db.collection('schedule').onSnapshot(
          snapshot => {
            const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (loaded.length > 0) {
              setSchedule(loaded);
              try { localStorage.setItem('hod_v13_schedule', JSON.stringify(loaded)); } catch(e){}
            }
          },
          err => console.warn("Schedule Firestore Error:", err)
        );

        // 4. Sync Users Collection
        const unsubUsers = db.collection('users').onSnapshot(
          snapshot => {
            const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (loaded.length > 0) {
              setUsersList(loaded);
              try { localStorage.setItem('hod_v13_users', JSON.stringify(loaded)); } catch(e){}
            } else {
              // Write default admin if empty
              db.collection('users').doc(DEFAULT_ADMIN.id).set(DEFAULT_ADMIN);
            }
          },
          err => console.warn("Users Firestore Error:", err)
        );

        return () => {
          unsubStudents();
          unsubRooms();
          unsubSchedule();
          unsubUsers();
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(successMsg))
            .catch(() => fallbackCopy(text, successMsg));
        } else {
          fallbackCopy(text, successMsg);
        }
      };

      const fallbackCopy = (text, successMsg) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(successMsg);
        } catch (err) {
          showToast('Αντιγράψτε χειροκίνητα το κείμενο.');
        }
        document.body.removeChild(textArea);
      };

          ...slotForm,

      const filteredRecipientEmails = useMemo(() => {

                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Επίθετο *</label>
                      <input type="text" required value={studentForm.lastName} onChange={e => setStudentForm({...studentForm, lastName: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Ημερομηνία Γέννησης</label>
                      <input type="date" value={studentForm.dob} onChange={e => setStudentForm({...studentForm, dob: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">ΑΜΚΑ</label>
                      <input type="text" value={studentForm.amka} onChange={e => setStudentForm({...studentForm, amka: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Διεύθυνση Κατοικίας</label>
                      <input type="text" value={studentForm.address} onChange={e => setStudentForm({...studentForm, address: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                  </div>

                  {/* PARENTS & CONTACT */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-gray-800">
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Ονοματεπώνυμο Γονέων</label>
                      <input type="text" value={studentForm.parentsNames} onChange={e => setStudentForm({...studentForm, parentsNames: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Κινητό Επικοινωνίας</label>
                      <input type="text" value={studentForm.parentsMobiles} onChange={e => setStudentForm({...studentForm, parentsMobiles: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Σταθερό Τηλέφωνο</label>
                      <input type="text" value={studentForm.landline} onChange={e => setStudentForm({...studentForm, landline: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                  </div>

                  {/* TAX DETAILS & EMAIL */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Email</label>
                      <input type="email" value={studentForm.email} onChange={e => setStudentForm({...studentForm, email: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">ΑΦΜ</label>
                      <input type="text" value={studentForm.afm} onChange={e => setStudentForm({...studentForm, afm: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">ΔΟΥ</label>
                      <input type="text" value={studentForm.doy} onChange={e => setStudentForm({...studentForm, doy: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                  </div>

                  {/* DANCE CLASSES CHECKBOXES */}
                  <div className="pt-2 border-t border-gray-800">
                    <label className="block text-amber-500 font-bold mb-2">Εγγραφή σε Τμήματα Χορού</label>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-[#0c0d10] p-3 rounded-2xl border border-gray-800 max-h-40 overflow-y-auto">
                      {DANCE_CLASSES.map(cls => (
                        <label key={cls} className="flex items-center gap-2 cursor-pointer text-[11px] text-gray-300 hover:text-white">
                          <input
                            type="checkbox"
                            checked={(studentForm.classes || []).includes(cls)}
                            onChange={() => handleToggleClass(cls)}
                            className="rounded border-gray-700 text-amber-500 focus:ring-amber-500"
                          />
                          <span>{cls}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* NOTES & GUARDIAN NAME FOR RECEIPTS */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Ιατρικές Σημειώσεις / Αλλεργίες ⚠️</label>
                      <textarea rows="2" value={studentForm.notes} onChange={e => setStudentForm({...studentForm, notes: e.target.value})} placeholder="π.χ. Άσθμα..." className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Όνοματεπώνυμο Γονέα (Για Αποδείξεις)</label>
                      <textarea rows="2" value={studentForm.receiptDetails} onChange={e => setStudentForm({...studentForm, receiptDetails: e.target.value})} placeholder="Ονοματεπώνυμο γονέα για έκδοση αποδείξεων..." className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white focus:border-amber-500" />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-gray-800">
                    <button type="button" onClick={() => setIsStudentModalOpen(false)} className="px-5 py-2.5 bg-gray-900 text-gray-400 rounded-xl font-bold">Ακύρωση</button>
                    <button type="submit" className="px-6 py-2.5 bg-amber-500 text-black font-extrabold rounded-xl hover:bg-amber-400 transition-all">Αποθήκευση Καρτέλας</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODAL 2: KARTELLA VIEW ================= */}
          {kartellaStudent && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#16181d] border border-amber-500/40 max-w-2xl w-full p-6 sm:p-8 rounded-3xl space-y-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-gray-800 pb-4">
                  <div>
                    <h3 className="text-xl font-black text-white">ΚΑΡΤΕΛΑ ΜΑΘΗΤΗ</h3>
                    <p className="text-xs text-amber-500 font-bold">{kartellaStudent.lastName} {kartellaStudent.firstName}</p>
                  </div>
                  <button onClick={() => setKartellaStudent(null)} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-[#0c0d10] p-4 rounded-2xl border border-gray-800 space-y-2">
                    <p className="text-amber-500 font-bold uppercase text-[10px]">Προσωπικά Στοιχεία</p>
                    <p><span className="text-gray-400">Ημ. Γέννησης:</span> <span className="font-semibold text-white">{kartellaStudent.dob || '-'}</span></p>
                    <p><span className="text-gray-400">ΑΜΚΑ:</span> <span className="font-semibold text-white">{kartellaStudent.amka || '-'}</span></p>
                    <p><span className="text-gray-400">Διεύθυνση:</span> <span className="font-semibold text-white">{kartellaStudent.address || '-'}</span></p>
                  </div>

                  <div className="bg-[#0c0d10] p-4 rounded-2xl border border-gray-800 space-y-2">
                    <p className="text-amber-500 font-bold uppercase text-[10px]">Γονείς & Επικοινωνία</p>
                    <p><span className="text-gray-400">Γονείς:</span> <span className="font-semibold text-white">{kartellaStudent.parentsNames || '-'}</span></p>
                    <p><span className="text-gray-400">Κινητό:</span> <span className="font-semibold text-white">{kartellaStudent.parentsMobiles || '-'}</span></p>
                    <p><span className="text-gray-400">Email:</span> <span className="font-semibold text-white">{kartellaStudent.email || '-'}</span></p>
                  </div>

                  <div className="bg-[#0c0d10] p-4 rounded-2xl border border-gray-800 space-y-2">
                    <p className="text-amber-500 font-bold uppercase text-[10px]">Εγγεγραμμένα Τμήματα</p>
                    <p className="text-amber-400 font-bold text-sm">{(kartellaStudent.classes || []).join(', ') || 'Κανένα'}</p>
                  </div>

                  <div className="bg-[#0c0d10] p-4 rounded-2xl border border-gray-800 space-y-2">
                    <p className="text-amber-500 font-bold uppercase text-[10px]">Στοιχεία Αποδείξεων</p>
                    <p><span className="text-gray-400">Όνομα Γονέα:</span> <span className="font-semibold text-white">{kartellaStudent.receiptDetails || '-'}</span></p>
                  </div>

                  {kartellaStudent.notes && (
                    <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl">
                      <p className="text-amber-400 font-bold uppercase text-[10px]">⚠️ Ιατρικές Σημειώσεις</p>
                      <p className="text-white mt-1">{kartellaStudent.notes}</p>
                    </div>
                  )}
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-gray-800">
                  <button onClick={() => setKartellaStudent(null)} className="px-4 py-2 bg-gray-900 text-gray-400 rounded-xl font-bold text-xs">Κλείσιμο</button>
                  <button onClick={() => handlePrintKartella(kartellaStudent)} className="px-6 py-2.5 bg-amber-500 text-black font-extrabold rounded-xl text-xs">🖨️ Εκτύπωση Καρτέλας A4</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 3: CLASSROOM MANAGER ================= */}
          {isRoomModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#16181d] border border-amber-500/30 max-w-lg w-full p-6 rounded-3xl space-y-6">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="text-base font-black text-white">Διαχείριση Αιθουσών Σχολής</h3>
                  <button onClick={() => setIsRoomModalOpen(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddRoom} className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Όνομα νέας αίθουσας (π.χ. Studio C)..."
                    value={newRoomName}
                    onChange={e => setNewRoomName(e.target.value)}
                    className="flex-1 bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-xs text-white"
                  />
                  <button type="submit" className="bg-amber-500 text-black font-bold px-4 py-2.5 rounded-xl text-xs">➕ Προσθήκη</button>
                </form>

                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {classrooms.map((room, idx) => (
                    <div key={room} className="bg-[#0c0d10] border border-gray-800 p-3 rounded-xl flex items-center justify-between text-xs">
                      <span className="font-bold text-white">📍 {room}</span>
                      <button onClick={() => handleDeleteRoom(idx)} className="text-red-400 hover:text-red-300 font-semibold">🗑️ Διαγραφή</button>
                    </div>
                  ))}
                </div>

                <div className="text-right pt-2 border-t border-gray-800">
                  <button onClick={() => setIsRoomModalOpen(false)} className="px-4 py-2 bg-gray-900 text-gray-400 text-xs font-bold rounded-xl">Έτοιμο</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 4: ADD/EDIT SCHEDULE SLOT ================= */}
          {isSlotModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#16181d] border border-amber-500/30 max-w-md w-full p-6 rounded-3xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="text-base font-black text-white">
                    {editingSlotId ? 'Επεξεργασία Μαθήματος' : 'Προσθήκη Μαθήματος στο Πρόγραμμα'}
                  </h3>
                  <button onClick={() => setIsSlotModalOpen(false)} className="text-gray-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveSlot} className="space-y-3">
                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Ημέρα Εβδομάδας</label>
                    <select value={slotForm.day} onChange={e => setSlotForm({...slotForm, day: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white">
                      {WEEK_DAYS.map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Ώρα Έναρξης</label>
                      <input type="time" value={slotForm.startTime} onChange={e => setSlotForm({...slotForm, startTime: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-bold mb-1">Ώρα Λήξης</label>
                      <input type="time" value={slotForm.endTime} onChange={e => setSlotForm({...slotForm, endTime: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Τμήμα Χορού</label>
                    <select value={slotForm.danceClass} onChange={e => setSlotForm({...slotForm, danceClass: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white">
                      {DANCE_CLASSES.map(cls => <option key={cls} value={cls}>{cls}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Αίθουσα</label>
                    <select value={slotForm.classroom} onChange={e => setSlotForm({...slotForm, classroom: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white">
                      {classrooms.map(room => <option key={room} value={room}>{room}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Διδάσκων / Καθηγητής</label>
                    <input type="text" value={slotForm.teacher} onChange={e => setSlotForm({...slotForm, teacher: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-gray-800">
                    <button type="button" onClick={() => setIsSlotModalOpen(false)} className="px-4 py-2 bg-gray-900 text-gray-400 rounded-xl">Ακύρωση</button>
                    <button type="submit" className="px-5 py-2 bg-amber-500 text-black font-bold rounded-xl">Αποθήκευση</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODAL 5: ADD USER ================= */}
          {isUserModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#16181d] border border-amber-500/30 max-w-md w-full p-6 rounded-3xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="text-base font-black text-white">Δημιουργία Νέου Χρήστη</h3>
                  <button onClick={() => setIsUserModalOpen(false)} className="text-gray-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveUser} className="space-y-3">
                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Ονοματεπώνυμο</label>
                    <input type="text" required value={userForm.name} onChange={e => setUserForm({...userForm, name: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Email / Username</label>
                    <input type="text" required value={userForm.username} onChange={e => setUserForm({...userForm, username: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Κωδικός Πρόσβασης</label>
                    <input type="password" required value={userForm.password} onChange={e => setUserForm({...userForm, password: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-gray-400 font-bold mb-1">Ρόλος</label>
                    <select value={userForm.role} onChange={e => setUserForm({...userForm, role: e.target.value})} className="w-full bg-[#0c0d10] border border-gray-800 rounded-xl p-2.5 text-white">
                      <option value="staff">Staff (Γραμματεία)</option>
                      <option value="admin">Admin (Διαχειριστής)</option>
                    </select>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-gray-800">
                    <button type="button" onClick={() => setIsUserModalOpen(false)} className="px-4 py-2 bg-gray-900 text-gray-400 rounded-xl">Ακύρωση</button>
                    <button type="submit" className="px-5 py-2 bg-amber-500 text-black font-bold rounded-xl">Δημιουργία</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= DELETE CONFIRMATION DIALOG ================= */}
          {deleteModal.open && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#16181d] border border-red-500/40 max-w-sm w-full p-6 rounded-3xl space-y-4 text-center">
                <div className="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/30 text-red-400 text-2xl flex items-center justify-center mx-auto">
                  ⚠️
                </div>
                <h3 className="text-base font-bold text-white">{deleteModal.title}</h3>
                <p className="text-xs text-gray-400">{deleteModal.message}</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setDeleteModal({ open: false, title: '', message: '', onConfirm: null })} className="px-4 py-2 bg-gray-900 text-gray-400 text-xs font-bold rounded-xl">Ακύρωση</button>
                  <button onClick={deleteModal.onConfirm} className="px-5 py-2 bg-red-500 text-white text-xs font-bold rounded-xl">Διαγραφή</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#16181d] border-t border-gray-800/80 py-6 text-center text-xs text-gray-500">
            <p className="font-semibold text-gray-400">HOUSE OF DANCE KYPARISSIA</p>
            <p className="text-[10px] text-gray-600 mt-1">Σχολή Χορού Αναγνωρισμένη από το Κράτος | Susan Jane Garrard</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
